<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>SonnaLab | Le laboratoire d'idées qui transforme le digital</title>
    <meta name="description" content="SonnaLab, le laboratoire d'idées qui transforme le digital. Développement web, applications mobiles et solutions technologiques innovantes pour votre entreprise." />
    <meta name="keywords" content="développement web, applications mobiles, innovation digitale, transformation numérique, laboratoire technologique, solutions digitales" />
    <meta name="author" content="SonnaLab" />
    <!-- 2026-08-12 : pas de balise robots statique ici -- react-helmet-async
         ne supprime que les balises qu'il a lui-meme creees (marquees
         data-rh), jamais celle-ci si elle etait presente. Resultat observe :
         deux <meta name="robots"> simultanees en DOM final sur les pages
         qui posent noindex (ex. 404.tsx), l'ancienne "index, follow"
         restant a cote. L'absence de balise = "index, follow" implicite
         (comportement par defaut des crawlers), donc aucune regression pour
         les pages qui n'en posent pas explicitement (legal/*, auth/*) --
         chaque page qui a besoin d'un robots different (SEO.tsx, 404.tsx)
         le declare elle-meme via Helmet, sans plus jamais entrer en
         conflit avec un tag statique. -->
    <meta name="language" content="French" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sonnalab.com/" />
    <meta property="og:title" content="SonnaLab | Le laboratoire d'idées qui transforme le digital" />
    <meta property="og:description" content="SonnaLab, le laboratoire d'idées qui transforme le digital. Développement web, applications mobiles et solutions technologiques innovantes." />
    <meta property="og:image" content="https://sonnalab.com/assets/images/og-image.jpg" />
    <meta property="og:site_name" content="SonnaLab" />
    <meta property="og:locale" content="fr_FR" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sonnalab.com/" />
    <meta property="twitter:title" content="SonnaLab | Le laboratoire d'idées qui transforme le digital" />
    <meta property="twitter:description" content="SonnaLab, le laboratoire d'idées qui transforme le digital. Développement web, applications mobiles et solutions technologiques innovantes." />
    <meta property="twitter:image" content="https://sonnalab.com/assets/images/twitter-image.jpg" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Microsoft -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/favicon/favicon-32x32.png" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://sonnalab.com/" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 2026-09-01 : la police Raleway etait chargee via @import en tete de
         src/index.css. Une fois ce CSS inline dans le <head> (fix FOUC
         precedent), le navigateur doit d'abord parser tout le bloc <style>
         (~223 Ko) avant meme de decouvrir cet @import -- puis enchainer deux
         allers-retours reseau (CSS Google Fonts, puis les fichiers .woff2)
         APRES le premier paint. Avec display=swap, le H1 pre-rendu (visible
         des le premier paint, voir headerHtml()/homeHeroHtml() dans
         prerender-blog.mjs) s'affiche entre-temps avec la police de repli du
         navigateur -- plus grasse/differente de Raleway -- puis change
         d'aspect au chargement de la vraie police. Signale par l'utilisateur
         comme du texte "en gras sur une page blanche" une fraction de
         seconde avant l'affichage final. Un vrai <link rel="stylesheet">
         ici est decouvert par le parser HTML immediatement, en parallele du
         reste (y compris du <style> inline), sans attendre sa lecture --
         coupe un aller-retour complet sur le chemin critique de la police. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&amp;display=swap" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SonnaLab",
      "url": "https://sonnalab.com",
      "logo": "https://sonnalab.com/assets/logo/sonnalab-logo.png",
      "description": "SonnaLab, le laboratoire d'idées qui transforme le digital",
      "slogan": "Le laboratoire d'idées qui transforme le digital",
      "sameAs": [
        "https://www.linkedin.com/company/sonnalab",
        "https://twitter.com/sonnalab",
        "https://github.com/sonnalab"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["French", "English"]
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
