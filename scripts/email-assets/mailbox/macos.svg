<svg xmlns="http://www.w3.org/2000/svg" width="472" height="236" viewBox="0 0 472 236" font-family="Raleway, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f0f0f" flood-opacity="0.14"/></filter>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="220%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f0f0f" flood-opacity="0.12"/></filter>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c9c9ce"/></pattern>
    <clipPath id="card"><rect width="472" height="236" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="472" height="236" fill="#f4f4f5"/>
    <circle cx="40" cy="0" r="120" fill="#ececee"/>
    <circle cx="460" cy="240" r="96" fill="#f6e86f" opacity="0.55"/>
    <rect x="382" y="20" width="72" height="44" fill="url(#dots)"/>
    <!-- monitor -->
    <path d="M216 196 h40 l6 22 h-52 z" fill="#d9dce1"/>
    <rect x="196" y="216" width="80" height="6" rx="3" fill="#c9c9ce"/>
    <g filter="url(#sh)"><rect x="106" y="26" width="260" height="172" rx="12" fill="#0f0f0f"/></g>
    <rect x="112" y="32" width="248" height="160" rx="7" fill="#ffffff"/>
    <!-- window chrome -->
    <rect x="112" y="32" width="248" height="16" rx="7" fill="#f4f4f5"/>
    <rect x="112" y="40" width="248" height="8" fill="#f4f4f5"/>
    <circle cx="122" cy="40" r="2.6" fill="#c9c9ce"/><circle cx="130" cy="40" r="2.6" fill="#c9c9ce"/><circle cx="138" cy="40" r="2.6" fill="#c9c9ce"/>
    <!-- sidebar -->
    <rect x="112" y="48" width="64" height="144" fill="#f8f8f9"/>
    <text x="119" y="62" font-size="6.5" font-weight="800" fill="#0f0f0f">Mail</text>
    <rect x="116" y="68" width="56" height="11" rx="3" fill="#ececee"/>
    <text x="120" y="75.6" font-size="5" font-weight="700" fill="#0f0f0f">{{inbox}}</text>
    <text x="120" y="88.6" font-size="5" font-weight="500" fill="#6b7280">{{sent}}</text>
    <text x="120" y="100.6" font-size="5" font-weight="500" fill="#6b7280">{{drafts}}</text>
    <!-- message lines -->
    <rect x="186" y="58" width="80" height="5" rx="2.5" fill="#d9dce1"/>
    <rect x="186" y="70" width="150" height="4" rx="2" fill="#eceef1"/>
    <rect x="186" y="80" width="130" height="4" rx="2" fill="#eceef1"/>
    <!-- add account dialog -->
    <g filter="url(#sh2)"><rect x="190" y="68" width="156" height="114" rx="10" fill="#ffffff"/></g>
    <rect x="190.5" y="68.5" width="155" height="113" rx="9.5" fill="none" stroke="#eceef1"/>
    <rect x="257" y="75" width="22" height="22" rx="7" fill="#f6e86f"/>
    <path d="M261.5 81.5 h13 v10 h-13 z M261.5 81.5 l6.5 5.5 l6.5 -5.5" fill="none" stroke="#0f0f0f" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="268" y="107" font-size="6.4" font-weight="800" fill="#0f0f0f" text-anchor="middle">{{add_mail_account}}</text>
    <text x="236" y="122" font-size="4.8" font-weight="700" fill="#6b7280" text-anchor="end">{{name}}</text>
    <rect x="240" y="115" width="94" height="10" rx="3.5" fill="#ffffff" stroke="#d9dce1" stroke-width="1"/>
    <text x="244" y="121.8" font-size="4.8" font-weight="600" fill="#0f0f0f">Eva Stein</text>
    <text x="236" y="136" font-size="4.8" font-weight="700" fill="#6b7280" text-anchor="end">{{email}}</text>
    <rect x="240" y="129" width="94" height="10" rx="3.5" fill="#ffffff" stroke="#d9dce1" stroke-width="1"/>
    <text x="244" y="135.8" font-size="4.8" font-weight="600" fill="#0f0f0f">{{address}}</text>
    <text x="236" y="150" font-size="4.8" font-weight="700" fill="#6b7280" text-anchor="end">{{password}}</text>
    <rect x="240" y="143" width="94" height="10" rx="3.5" fill="#ffffff" stroke="#d9dce1" stroke-width="1"/>
    <circle cx="246" cy="148" r="1.4" fill="#6b7280"/><circle cx="251" cy="148" r="1.4" fill="#6b7280"/><circle cx="256" cy="148" r="1.4" fill="#6b7280"/><circle cx="261" cy="148" r="1.4" fill="#6b7280"/><circle cx="266" cy="148" r="1.4" fill="#6b7280"/>
    <rect x="284" y="161" width="50" height="13" rx="6.5" fill="#0f0f0f"/>
    <text x="309" y="169.6" font-size="5.2" font-weight="800" fill="#ffffff" text-anchor="middle">{{sign_in}}</text>
    <rect x="236" y="161" width="44" height="13" rx="6.5" fill="#ffffff" stroke="#d9dce1" stroke-width="1"/>
    <text x="258" y="169.6" font-size="5.2" font-weight="700" fill="#0f0f0f" text-anchor="middle">{{cancel}}</text>
    <!-- chip: server -->
    <g filter="url(#sh)"><rect x="14" y="118" width="140" height="44" rx="14" fill="#ffffff" data-fit="c1"/></g>
    <rect x="23" y="126" width="28" height="28" rx="9" fill="#f4f4f5"/>
    <rect x="30" y="132" width="14" height="6.5" rx="2" fill="none" stroke="#0f0f0f" stroke-width="1.8"/>
    <rect x="30" y="141.5" width="14" height="6.5" rx="2" fill="none" stroke="#0f0f0f" stroke-width="1.8"/>
    <circle cx="33.5" cy="135.25" r="0.9" fill="#0f0f0f"/><circle cx="33.5" cy="144.75" r="0.9" fill="#0f0f0f"/>
    <text class="c1" x="59" y="138" font-size="8.5" font-weight="800" fill="#0f0f0f">mail.sonnalab.com</text>
    <text class="c1" x="59" y="149" font-size="7" font-weight="500" fill="#6b7280">IMAP 993 · SMTP 587</text>
    <!-- chip: done -->
    <g filter="url(#sh)"><rect x="352" y="96" width="110" height="44" rx="14" fill="#ffffff" data-fit="c2"/></g>
    <circle cx="374" cy="118" r="13" fill="#e9f8ee"/>
    <path d="M368 118.5 L372 122.5 L380 114" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="c2" x="395" y="116" font-size="9" font-weight="800" fill="#0f0f0f">{{connected}}</text>
    <text class="c2" x="395" y="127" font-size="7" font-weight="500" fill="#6b7280">Mail</text>
  </g>
</svg>
