# Rate limiting for sitemap refresh (max 30 req/min par IP — IndexNow + multi-publish bursts)
limit_req_zone $binary_remote_addr zone=sitemap_refresh:1m rate=30r/m;

# Real 301 redirects for archived blog slugs (generated by prerender-blog.mjs)
map $uri $blog_redirect {
    default "";
    include /var/www/sonnalab.com/build/blog-redirects.map;
}


# www HTTPS -> non-www (301)
server {
    listen 443 ssl http2;
    server_name www.sonnalab.com;
    ssl_certificate     /etc/letsencrypt/live/sonnalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonnalab.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://sonnalab.com$request_uri;
}

# Serveur principal HTTPS (non-www uniquement)
server {
    listen 443 ssl http2;
    server_name sonnalab.com;

    root /var/www/sonnalab.com/build;
    index index.html;

    # Sitemap webhook (token verifie par le service Node, rate-limited)
    location = /sitemap/refresh {
        limit_except POST { deny all; }
        limit_req zone=sitemap_refresh burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:9876/refresh;
        proxy_set_header   X-Sitemap-Token $http_x_sitemap_token;
        proxy_set_header   Host            $host;
        proxy_read_timeout 35s;
    }


    location = /66a83429b4bd189df88b9ba77f7037ef.txt {
        alias /etc/sonnalab/indexnow-keys/66a83429b4bd189df88b9ba77f7037ef.txt;
        add_header Content-Type "text/plain";
        access_log off;
    }
    # SEO hygiene: spam URLs + common attack scans -> 410 Gone
    location ~ ^/(vvxpc|321-425-5069)$ { return 410; }
    location ~ ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|\.env|\.git|\.aws|phpmyadmin) { return 410; }

    # 2026-08-17 : seul /fr/* reste redirigé vers l'URL non préfixée -- le
    # français est la langue par défaut, sans préfixe (comportement
    # inchangé). /en, /es, /it, /de ont désormais de vraies URLs (voir
    # blocs ci-dessous) au lieu d'être toutes redirigées comme avant
    # (ancienne règle du 2026-07-28, devenue trop large : elle empêchait
    # toute vraie URL préfixée d'exister, cause du bug diagnostiqué avec
    # l'utilisateur sur lecolt.com puis retrouvé ici).
    if ($request_uri ~* "^/fr(/.*)?$") { return 301 https://sonnalab.com$1; }

    # URLs préfixées par langue réelles (/en, /es, /it, /de), crawlables,
    # générées par scripts/prerender-blog.mjs. Home/blog/contact
    # uniquement -- seules pages dont le contenu diffère vraiment par
    # langue (voir LOCALIZED_PREFIXES dans src/router/index.tsx). Tout
    # autre sous-chemin sous un de ces préfixes (ex: /en/projects) n'est
    # pas une route réelle et retombe sur le catch-all 404 plus bas.
    location ~ ^/(en|es|it|de)$ {
        try_files $uri/index.html @shell;
    }
    location ~ ^/(en|es|it|de)/$ {
        return 301 https://sonnalab.com/$1;
    }
    location ~ ^/(en|es|it|de)/blog$ {
        try_files $uri/index.html @shell;
    }
    location ~ ^/(en|es|it|de)/blog/$ {
        return 301 https://sonnalab.com/$1/blog;
    }
    location ~ ^/(en|es|it|de)/contact$ {
        try_files $uri/index.html @shell;
    }
    location ~ ^/(en|es|it|de)/contact/$ {
        return 301 https://sonnalab.com/$1/contact;
    }

    # Real 301 for archived/duplicate blog slugs
    if ($blog_redirect != "") { return 301 $blog_redirect; }

    # Legacy no-prefix /blog/{slug} routes are statically prerendered per
    # article (scripts/prerender-blog.mjs). A slug with no matching static
    # file is an orphaned/renamed old URL, not a valid client-side route --
    # previously fell through to /index.html with HTTP 200 (generic
    # homepage content), which Google flags as Soft 404. Return a real 404
    # instead so it drops from the index cleanly (2026-07-23).
    location ~ ^/blog/[^/]+/?$ {
        try_files $uri $uri/index.html =404;
        # 2026-08-08 : le =404 brut ci-dessus servait la page d'erreur nginx
        # nue (aucun chrome du site, pas de lien retour) -- garde le vrai
        # statut HTTP 404 (necessaire pour que Search Console desindexe
        # proprement, voir le fix Soft 404 du 2026-07-23 juste au-dessus)
        # mais sert le shell SPA, dont le catch-all React Router (src/router/
        # index.tsx) affiche la page 404.tsx stylee (bouton Home, meta
        # noindex/nofollow) au lieu du texte brut "404 Not Found nginx/...".
        error_page 404 /index.html;
        # 2026-08-12, CORRIGE le meme jour : le X-Robots-Tag noindex avait ete
        # place ICI, dans le corps du location -- add_header s'applique a
        # TOUTE reponse produite par ce bloc, y compris un vrai article dont
        # try_files reussit du premier coup (jamais de passage par =404 /
        # error_page). Consequence reelle : Bing Webmaster Tools a signale
        # "Indexing allowed: No" sur un article bien publie et indexable
        # (sviluppo-web-su-misura-come-scegliere) -- TOUS les articles de ce
        # bloc recevaient noindex,nofollow par erreur. Le header est deplace
        # dans le catch-all final `location /`, seul point que
        # `error_page 404 /index.html` traverse reellement pour un slug
        # absent -- il ne s'applique donc plus qu'aux 404 reelles.
    }

    # 2026-08-11 : routes SPA de premier niveau connues (src/router/index.tsx)
    # -- fallback 200 vers index.html pour toute sous-route client-side.
    # A tenir a jour a chaque nouvelle section ajoutee au router.
    location ~ ^/(contact|projects|blog|legal|sign-in|sign-up|forgot-password|reset-password|confirm-email|dashboard|staff|admin)(/.*)?$ {
        try_files $uri $uri/index.html @shell;
    }

    # 2026-08-24 : la home elle-meme (bare "/") retombait dans le catch-all
    # `location /` juste en dessous (try_files $uri $uri/index.html trouve
    # bien /index.html, mais AJOUTE AUSSI son add_header X-Robots-Tag
    # noindex,nofollow -- la home entiere de sonnalab.com etait donc
    # deindexee en HTTP header, invisible cote navigateur/curl sans
    # verification explicite). Un `location = /` exact passe AVANT tout
    # prefix/regex en nginx et sert le shell (donc la home reelle,
    # prerenderee avec son vrai <title>) sans jamais toucher au catch-all.
    location = / {
        try_files /index.html =404;
    }

    # Shell SPA partage (200, jamais de noindex) -- utilise en named
    # location par les blocs ci-dessus au lieu d'un `/index.html` bare en
    # dernier argument de try_files. Un dernier argument try_files qui est
    # une URI nue (pas =404, pas @nom) declenche TOUJOURS une redirection
    # interne nginx qui refait matcher les location blocks depuis zero --
    # "/index.html" ne correspond a aucune regex specifique ci-dessus et
    # retombait donc dans le catch-all `location /`, heritant de son
    # add_header noindex meme pour une vraie route SPA valide (legal/*,
    # contact, projects...). Une named location est utilisee directement,
    # sans nouveau passage par l'algorithme de selection -- plus de fuite
    # vers le catch-all. Root cause du "Exclue par la balise noindex" sur
    # /legal/privacy et de la home elle-meme dans Search Console.
    location @shell {
        try_files /index.html =404;
    }

    # Tout le reste sous root (ex: /services, jamais une route reelle -- cf.
    # Search Console "Exclue par noindex") : meme traitement que /blog
    # (2026-08-08 juste au-dessus) -- vrai statut 404 au lieu du 200+noindex
    # via le shell SPA generique.
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    ssl_certificate     /etc/letsencrypt/live/sonnalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonnalab.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS non-www (www et non-www)
server {
    listen 80;
    server_name sonnalab.com www.sonnalab.com;
    return 301 https://sonnalab.com$request_uri;
}
